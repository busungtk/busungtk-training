<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지원자 체크리스트 | 부성티케이 현장지원팀</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="brand.css">
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #fafafa;
    --surface: #ffffff;
    --surface2: #fafafa;
    --border: #e5e5e5;
    --text: #1a1a1a;
    --text-dim: #6b7280;
    --text-bright: #111111;
    --accent: #EA5E18;
    --accent-text: #c2500f;
    --accent-tint: rgba(234, 94, 24, .08);
    --self: #385768;
    --self-tint: rgba(56, 87, 104, .10);
    --good: #15803d;
    --bad: #b91c1c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif; line-height: 1.65; min-height: 100vh; word-break: keep-all; }
  a { color: var(--accent-text); }
  button { font-family: inherit; }
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.97); border-bottom: 1px solid var(--border); }
  .topbar-in { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .back { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; white-space: nowrap; }
  .back:hover { color: var(--accent-text); }
  .brand { flex: 1; font-weight: 700; color: var(--text-bright); font-size: 0.95rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mode { font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 4px; white-space: nowrap; }
  .mode.self { background: var(--self-tint); color: var(--self); }
  .mode.iv { background: var(--accent-tint); color: var(--accent-text); }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 90px; }
  h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text-bright); line-height: 1.35; margin-bottom: 6px; }
  h2 { font-size: 1.02rem; letter-spacing: -0.02em; color: var(--text-bright); margin: 26px 0 4px; }
  .lead { color: var(--text-dim); font-size: 0.92rem; margin-bottom: 16px; }
  .muted { color: var(--text-dim); }
  .small { font-size: 0.82rem; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .note { background: var(--accent-tint); border: 0; border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 12px 14px; font-size: 0.86rem; }
  .warn { background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 12px 14px; font-size: 0.86rem; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: #fff; color: var(--text-bright); border-radius: 4px; padding: 10px 16px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; min-height: 44px; transition: border-color .2s; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-text); border-color: var(--accent-text); }
  .btn.self { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.self:hover { background: var(--accent-text); border-color: var(--accent-text); }
  .btn.ghost { background: transparent; }
  .btn.danger { background: transparent; color: var(--bad); border-color: rgba(185,28,28,0.4); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > .btn { flex: 1 1 150px; }
  input.txt, textarea.txt { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 11px 13px; color: var(--text-bright); font-size: 0.95rem; font-family: inherit; }
  textarea.txt { min-height: 80px; resize: vertical; line-height: 1.5; }
  input.txt:focus, textarea.txt:focus { outline: none; border-color: var(--accent); }
  input[type=date].txt { color-scheme: light; }

  /* 목록 */
  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .ap { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; cursor: pointer; text-align: left; color: var(--text); width: 100%; font-size: 0.92rem; transition: border-color .2s, transform .2s; }
  .ap:hover { border-color: var(--accent); transform: translateY(-2px); }
  .ap .nm { color: var(--text-bright); font-weight: 600; }
  .ap .body { flex: 1; min-width: 0; }
  .ap .sc { text-align: right; font-variant-numeric: tabular-nums; }
  .ap .sc b { font-size: 1.2rem; color: var(--text-bright); }
  .st { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 1px 8px; border-radius: 3px; margin-left: 6px; }
  .st.s0 { background: var(--self-tint); color: var(--self); }
  .st.s1 { background: var(--accent-tint); color: var(--accent-text); }
  .st.s2 { background: #f0fdf4; color: var(--good); }

  /* 문항 */
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .sec-h .w { font-size: 0.78rem; color: var(--text-dim); }
  .items { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .q { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
  .q .t { color: var(--text-bright); font-weight: 600; font-size: 0.93rem; }
  .q .d { color: var(--text-dim); font-size: 0.8rem; margin-top: 2px; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .opt { border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 4px; padding: 7px 11px; font-size: 0.84rem; cursor: pointer; min-height: 38px; transition: border-color .2s; }
  .opt:hover { border-color: var(--accent); }
  .opt.on { border-color: var(--accent); background: var(--accent-tint); color: var(--text-bright); font-weight: 600; }
  .self-mode .opt.on { border-color: var(--self); background: var(--self-tint); }
  .opt.was { box-shadow: inset 0 -3px 0 var(--self); }
  .said { font-size: 0.8rem; margin-top: 8px; color: var(--self); }
  .probe { font-size: 0.8rem; margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 6px 6px 0; }
  .probe b { color: var(--text-bright); }
  .probe .ans { color: var(--good); }
  .diff { font-size: 0.74rem; padding: 1px 7px; border-radius: 3px; margin-left: 6px; }
  .diff.dn { background: #fef2f2; color: var(--bad); }
  .diff.up { background: #f0fdf4; color: var(--good); }

  /* 점수 */
  .score { display: grid; grid-template-columns: 170px 1fr; gap: 16px; align-items: center; }
  .big { font-size: 2.8rem; font-weight: 800; color: var(--text-bright); line-height: 1; font-variant-numeric: tabular-nums; }
  .big small { font-size: 1rem; color: var(--text-dim); font-weight: 600; }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-r { display: grid; grid-template-columns: 92px 1fr 64px; gap: 10px; align-items: center; font-size: 0.82rem; }
  .bar-r .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-dim); }
  .track { position: relative; height: 10px; background: #f0f0f0; border-radius: 3px; overflow: hidden; }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .track i.s { background: rgba(56,87,104,0.35); }
  .track i.c { background: var(--accent); height: 6px; top: 2px; }
  .legend { display: flex; gap: 14px; font-size: 0.76rem; color: var(--text-dim); margin-top: 8px; flex-wrap: wrap; }
  .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend .ls::before { background: rgba(56,87,104,0.5); }
  .legend .lc::before { background: var(--accent); }
  .parthead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 30px 0 -6px; padding: 10px 14px; border-radius: 6px; background: var(--bg-alt); border: 1px solid var(--border); border-left: 3px solid var(--self); }
  .parthead.b { border-left-color: var(--accent); }
  .parthead b { color: var(--text-bright); }
  .parthead span { font-size: 0.8rem; color: var(--text-dim); }
  .prompt { margin-top: 10px; padding: 12px 14px; border-radius: 6px; background: var(--bg-alt); border: 1px solid var(--border); color: var(--text-bright); font-size: 0.93rem; line-height: 1.6; }
  .prompt span { display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; color: var(--accent-text); margin-bottom: 4px; }
  .q.flagq { border-color: rgba(185,28,28,0.35); }
  .opt.flagon { border-color: var(--bad) !important; background: #fef2f2 !important; }
  .probe .ans { color: var(--good); }
  .bar-sep { height: 1px; background: var(--border); margin: 2px 0; }
  /* 상황 판단 — 보기가 문장이라 한 줄씩 세운다 */
  .opts.col { flex-direction: column; align-items: stretch; }
  .opts.col .opt { text-align: left; line-height: 1.45; }
  /* 일하는 방식 프로필 */
  .profile .ph { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .profile .ph b { color: var(--text-bright); }
  .profile .ph span { font-size: 0.8rem; color: var(--text-dim); }
  .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pa { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; border-top: 3px solid var(--border); }
  .pa.l2 { border-top-color: var(--good); }
  .pa.l1 { border-top-color: var(--accent); }
  .pa.l0 { border-top-color: var(--bad); }
  .pa.risk { background: #fef2f2; }
  .pa .pn { font-size: 0.78rem; color: var(--text-dim); }
  .pa .pl { font-weight: 700; color: var(--text-bright); margin: 2px 0; font-size: 0.9rem; }
  @media (max-width: 560px) { .pgrid { grid-template-columns: 1fr 1fr; } }
  .stickybar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.97); border-top: 1px solid var(--border); padding: 10px 16px; z-index: 20; }
  .stickybar .in { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .stickybar .prog { flex: 1; font-size: 0.82rem; color: var(--text-dim); }
  .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%) translateY(20px); background: #1C1917; border: 1px solid #1C1917; color: #fff; padding: 10px 16px; border-radius: 4px; font-size: 0.86rem; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .empty { text-align: center; color: var(--text-dim); padding: 26px 10px; }
  @media (max-width: 560px) {
    .score { grid-template-columns: 1fr; }
    .bar-r { grid-template-columns: 100px 1fr 50px; font-size: 0.78rem; }
    .bar-r > span:first-child { white-space: nowrap; }
    h1 { font-size: 1.22rem; }
  }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="back" href="index.html" id="backLink">← 교육 홈</a>
  <div class="brand">지원자 체크리스트</div>
  <span class="mode" id="modeTag" hidden></span>
</div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
// 문항 — 직무와 관련된 것만 묻습니다 (나이·가족·출신지역·혼인·재산 등은 채용절차법상 묻지 않습니다)
// ■ 고치기: 문항 문장·보기·배점은 여기서 바꿉니다. id 는 저장된 기록과 연결되니 바꾸지 마세요.
// ■ 배점: 각 영역 점수 = (선택한 보기의 값 합 / 최대 합) × 영역 비중. 총점 100
//   (A 서류·자가 확인 50 + B 면접 평가 50). '위험·부적절한 답'은 점수에 넣지 않고 결과에 따로 표시합니다.
// ─────────────────────────────────────────────
const LEVELS = [
  { v: 0, t: '모름' },
  { v: 1, t: '본 적 있음' },
  { v: 2, t: '보조로 해 봄' },
  { v: 3, t: '혼자 할 수 있음' },
];
// 면접관 채점용 보기
const KNOW = [{ v: 0, t: '모름·틀림' }, { v: 1, t: '일부 맞음' }, { v: 2, t: '정확함' }];
const STEP = [{ v: 0, t: '언급 없음' }, { v: 1, t: '일부' }, { v: 2, t: '충분' }];
const FLAG = [{ v: 0, t: '없음' }, { v: 1, t: '있음' }];
// 상황 판단 문항의 면접관 확인 질문
const PROBE_J = '왜 그걸 골랐어요? 실제로 그렇게 한 적이 있나요?';
const PROBE_M = '왜 그걸 골랐어요? 비슷한 일이 실제로 있었나요?';

// part: 'A' = 지원자 자가 체크 → 면접관 확인 / 'B' = 면접관만 묻고 채점
const SECTIONS = [
  {
    id: 'basic', part: 'A', title: '기본 조건', weight: 0,
    desc: '점수에 넣지 않습니다. 근무가 가능한지만 확인합니다.',
    items: [
      { id: 'lic1', t: '1종 보통 운전면허가 있다', d: '현장 이동 차량(포터) 운전 — 공고 필수 조건', opts: [{ v: 1, t: '있음' }, { v: 0, t: '없음' }], probe: '면허증 확인' },
      { id: 'weekend', t: '분기 1~2회 주말 작업이 가능하다', d: '주말 작업은 수당으로 지급', opts: [{ v: 1, t: '가능' }, { v: 0, t: '어려움' }] },
    ],
  },
  {
    id: 'cert', part: 'A', title: '자격증', weight: 8,
    desc: '가진 것을 모두 고르세요. 면접관이 자격증 사본으로 확인합니다.',
    items: [
      { id: 'c_ref', t: '공조냉동기계기능사 / 산업기사', opts: [{ v: 0, t: '없음' }, { v: 2, t: '기능사' }, { v: 3, t: '산업기사 이상' }], probe: '자격증 사본 확인' },
      { id: 'c_weld', t: '용접 관련 자격 (용접·특수용접기능사 등)', opts: [{ v: 0, t: '없음' }, { v: 3, t: '있음' }], probe: '자격증 사본 확인' },
      { id: 'c_elec', t: '전기기능사 이상', opts: [{ v: 0, t: '없음' }, { v: 3, t: '있음' }], probe: '자격증 사본 확인' },
      { id: 'c_gas', t: '가스기능사 / 배관기능사', opts: [{ v: 0, t: '없음' }, { v: 3, t: '있음' }], probe: '자격증 사본 확인' },
    ],
  },
  {
    id: 'exp', part: 'A', title: '관련 경력', weight: 12,
    desc: '직장에서 실제로 한 기간만 적습니다. 면접관이 경력증명·이력서로 확인합니다.',
    items: [
      { id: 'e_ref', t: '냉동·공조 설비 설치·수리', opts: [{ v: 0, t: '없음' }, { v: 1, t: '1년 미만' }, { v: 2, t: '1~3년' }, { v: 3, t: '3년 이상' }], probe: '어떤 장비를, 혼자였는지 보조였는지' },
      { id: 'e_kit', t: '업소용 주방설비 (냉장고·세척기·화구 등)', opts: [{ v: 0, t: '없음' }, { v: 1, t: '1년 미만' }, { v: 2, t: '1~3년' }, { v: 3, t: '3년 이상' }], probe: '주로 간 현장(구내식당·식당·카페)과 하루 건수' },
      { id: 'e_weld', t: '용접·기물 제작', opts: [{ v: 0, t: '없음' }, { v: 1, t: '1년 미만' }, { v: 2, t: '1~3년' }, { v: 3, t: '3년 이상' }], probe: '스텐(티그)인지 동관(토치)인지' },
      { id: 'e_pipe', t: '배관·설비 시공', opts: [{ v: 0, t: '없음' }, { v: 1, t: '1년 미만' }, { v: 2, t: '1~3년' }, { v: 3, t: '3년 이상' }] },
      { id: 'e_elec', t: '전기 배선·제어', opts: [{ v: 0, t: '없음' }, { v: 1, t: '1년 미만' }, { v: 2, t: '1~3년' }, { v: 3, t: '3년 이상' }] },
    ],
  },
  {
    id: 'skill', part: 'A', title: '할 수 있는 작업', weight: 15,
    desc: '회사 A/S·시공에서 실제로 많이 하는 작업입니다.',
    items: [
      { id: 's_ref', t: '냉장·냉동 장비 점검 (온도·성에·팬·패킹)', d: '견적 584건 — 회사 A/S의 중심', opts: LEVELS, probe: '마지막으로 한 현장, 혼자였는지 보조였는지' },
      { id: 's_refgas', t: '냉매 계통 작업 (누설 탐지·진공·충전)', opts: LEVELS, probe: '마지막으로 한 현장, 혼자였는지 보조였는지' },
      { id: 's_pipe', t: '수전·배관·배수 수리', d: '가장 많은 분야 (1,181건)', opts: LEVELS, probe: '마지막으로 한 현장, 혼자였는지 보조였는지' },
      { id: 's_dish', t: '식기세척기·컨베이어 점검', opts: LEVELS, probe: '마지막으로 한 현장, 혼자였는지 보조였는지' },
      { id: 's_warm', t: '온장고·보온배식대·소독고 수리', opts: LEVELS, probe: '마지막으로 한 현장, 혼자였는지 보조였는지' },
      { id: 's_gas', t: '가스 화구 점검 (버너·밸브·점화)', opts: LEVELS, probe: '마지막으로 한 현장, 혼자였는지 보조였는지' },
      { id: 's_weld', t: '용접 (스텐 티그 / 동관 토치)', opts: LEVELS, probe: '마지막으로 한 현장, 혼자였는지 보조였는지' },
      { id: 's_inst', t: '주방 기물 시공·납품 설치', opts: LEVELS, probe: '마지막으로 한 현장, 혼자였는지 보조였는지' },
      { id: 's_elec', t: '간단한 전기 배선·부품 교체', opts: LEVELS, probe: '마지막으로 한 현장, 혼자였는지 보조였는지' },
    ],

const maxOf = it => Math.max(...it.opts.map(o => o.v));
function scoreOf(answers, part) {
  const secs = SCORED.filter(sc => !part || sc.part === part).map(sc => {
    const its = sc.items.filter(isScored);
    const max = its.reduce((n, it) => n + maxOf(it), 0);
    // 음수 값(위험·부적절 -1, 다름 -0.5)은 0점으로 친다
    const got = its.reduce((n, it) => n + (answers && answers[it.id] != null ? Math.max(0, answers[it.id]) : 0), 0);
    return { id: sc.id, title: sc.title, part: sc.part, weight: sc.weight, pts: max ? got / max * sc.weight : 0 };
  });
  return { total: Math.round(secs.reduce((n, x) => n + x.pts, 0)), max: secs.reduce((n, x) => n + x.weight, 0), secs };
}
function answered(answers, items) { return (items || SELF_ITEMS).filter(it => answers && answers[it.id] != null).length; }
// 위험·부적절한 답 — B 파트 표시 문항(값 1) + A 파트 상황 판단에서 -1 보기를 고른 것
const ansOf = (rec, id) => rec.confirmed && rec.confirmed[id] != null ? rec.confirmed[id] : (rec.self ? rec.self[id] : null);
const flagsOf = rec => [
  ...IV_ITEMS.filter(it => it.flag && rec.confirmed && rec.confirmed[it.id] === 1).map(it => SECTIONS.find(x => x.id === it.sec).title),
  ...SELF_ITEMS.filter(it => ansOf(rec, it.id) === -1 && it.opts.some(o => o.v === -1)).map(it => SECTIONS.find(x => x.id === it.sec).title + ' — ' + it.opts.find(o => o.v === -1).t),
];
// 일하는 방식 프로필 — 영역별 합(0~4)을 세 칸으로
const MIND = SECTIONS.find(s => s.profile);
const MIND_AREAS = [...new Set(MIND.items.map(it => it.area))];
function profileOf(rec) {
  return MIND_AREAS.map(area => {
    const its = MIND.items.filter(it => it.area === area);
    const vals = its.map(it => ansOf(rec, it.id));
    const n = vals.filter(v => v != null).length;
    const sum = vals.reduce((a, v) => a + Math.max(0, v || 0), 0);
    const risk = vals.some(v => v === -1);
    const level = !n ? null : sum >= 4 ? 2 : sum >= 2 ? 1 : 0;
    const label = level == null ? '안 답함' : n < its.length ? '일부만 답함' : ['다르다', '비슷하다', '우리 방식과 같다'][level];
    return { area, sum, n, total: its.length, risk, level: n < its.length ? null : level, label };
  });
}

function renderItems(rec, mode) {

  let partShown = null;

          ${it.good ? `<div class="probe"><b>${it.flag ? '해당되면 표시' : '좋은 답'}:</b> ${esc(it.good)}</div>` : ''}
          ${it.ans ? `<div class="probe"><b>기대 답:</b> <span class="ans">${esc(it.ans)}</span></div>` : ''}
          ${opts}</div>`;
      }
      const was = rec.self[it.id];
      const selfTxt = was != null ? (it.opts.find(o => o.v === was) || {}).t : null;
      const d = mode === 'review' && cur != null && was != null && cur !== was ? `<span class="diff ${cur < was ? 'dn' : 'up'}">${cur < was ? '낮춤' : '올림'}</span>` : '';
      return `<div class="q"><div class="t">${esc(it.t)}${d}</div>${it.d ? `<div class="d">${esc(it.d)}</div>` : ''}
        ${opts}
        ${mode === 'review' ? `<div class="said">지원자 답: ${selfTxt ? esc(selfTxt) : '(비워 둠)'}</div>${it.probe ? `<div class="probe"><b>확인:</b> ${esc(it.probe)}</div>` : ''}` : ''}
      </div>`;
    }).join('');
    return `${head}
      <div class="sec-h"><h2>${esc(sc.title)}</h2><span class="w">${sc.weight ? '비중 ' + sc.weight + '점' : sc.profile ? '점수 없음 · 프로필' : '점수 없음'}</span></div>

      <div class="items">${block}</div>`;
  }).join('');
}

    document.getElementById('finBtn').onclick = async () => {
      const left = IV_ITEMS.filter(it => !it.flag && rec.confirmed[it.id] == null).length;
      if (left && !confirm('면접 평가에서 채점하지 않은 항목이 ' + left + '개 있습니다. 0점으로 두고 완료할까요?')) return;
      rec.memo = document.getElementById('memo').value; rec.status = 'done'; rec.reviewed_at = new Date().toISOString(); await put(rec); toast('확인 완료로 저장했습니다'); go('#/result/' + rec.id); };
    document.getElementById('backSelf').onclick = async () => { rec.status = 'self'; await put(rec); go('#/self/' + rec.id); };
  };
  draw(); window.scrollTo(0, 0);
}

function scoreCard(rec) {
  const c = scoreOf(rec.confirmed), s = scoreOf(rec.self);
  const cA = scoreOf(rec.confirmed, 'A'), cB = scoreOf(rec.confirmed, 'B'), sA = scoreOf(rec.self, 'A');
  const flags = flagsOf(rec);
  const bar = (x, sx) => `<div class="bar-r"><span>${esc(x.title.replace(/ · .*/, ''))}</span><div class="track">${sx ? `<i class="s" style="width:${sx.pts / x.weight * 100}%"></i>` : ''}<i class="c" style="width:${x.pts / x.weight * 100}%"></i></div><span class="v">${Math.round(x.pts)}/${x.weight}</span></div>`;
  return `<div class="card score" style="margin-top:6px">
    <div><div class="big">${c.total}<small> / 100</small></div>
      <div class="small muted" style="margin-top:6px">A 서류·자가 확인 <b style="color:var(--text-bright)">${cA.total}</b>/50 <span class="muted">(자가 ${sA.total})</span><br>B 면접 평가 <b style="color:var(--text-bright)">${cB.total}</b>/50</div>
      ${flags.length ? `<div class="small" style="color:var(--bad);margin-top:6px">⚠ 위험한 답 ${flags.length}건</div>` : ''}</div>
    <div><div class="bars">${cA.secs.map((x, i) => bar(x, sA.secs[i])).join('')}<div class="bar-sep"></div>${cB.secs.map(x => bar(x)).join('')}</div>
    <div class="legend"><span class="ls">자가</span><span class="lc">확인·채점</span></div></div>
  </div>
  ${profileCard(rec)}`;
}

// 일하는 방식 프로필 — 점수가 아니라 면접에서 이야기할 재료
function profileCard(rec) {
  const prof = profileOf(rec);
  if (!prof.some(p => p.n)) return '';
  return `<div class="card profile" style="margin-top:10px">
    <div class="ph"><b>일하는 방식</b><span>점수에 넣지 않습니다. 「왜 그걸 골랐나」를 면접에서 물어보세요.</span></div>
    <div class="pgrid">${prof.map(p => `<div class="pa ${p.level == null ? '' : 'l' + p.level} ${p.risk ? 'risk' : ''}"><div class="pn">${esc(p.area)}</div><div class="pl">${esc(p.label)}</div><div class="small muted">${p.sum}/${p.total * 2}${p.risk ? ' · <span style="color:var(--bad)">위험한 답</span>' : ''}</div></div>`).join('')}</div>
  </div>`;
}

// 결과
async function viewResult(id) {
  const rec = await getOne(id); if (!rec) return go('#/');
  setMode('iv');
  const basic = SECTIONS[0].items.map(it => { const v = rec.confirmed[it.id] != null ? rec.confirmed[it.id] : rec.self[it.id]; const o = it.opts.find(x => x.v === v); return `<span style="margin-right:14px">${esc(it.t)}: <b style="color:${v ? 'var(--good)' : 'var(--bad)'}">${o ? esc(o.t) : '-'}</b></span>`; }).join('');
  const changed = ALL_ITEMS.filter(it => rec.self[it.id] != null && rec.confirmed[it.id] != null && rec.self[it.id] !== rec.confirmed[it.id]);
  $app.innerHTML = `<div class="small"><a href="#/" style="text-decoration:none">← 지원자 목록</a></div>
    <h1>${esc(rec.name)} <span class="st s2" style="vertical-align:middle">확인 완료</span></h1>
    <p class="lead">면접일 ${esc(rec.interview_date || '-')} · 확인 ${fmtD(rec.reviewed_at)}</p>
    ${scoreCard(rec)}
    <div class="card" style="margin-top:10px;font-size:0.88rem">${basic}</div>
    ${flagsOf(rec).length ? `<div class="warn" style="margin-top:10px;border-color:rgba(185,28,28,0.35);background:#fef2f2"><b style="color:var(--bad)">위험·부적절한 답</b> — ${flagsOf(rec).map(esc).join(', ')}. 점수와 별개로 반드시 이야기하세요.</div>` : ''}
    <div class="note" style="margin-top:10px">이 점수는 연봉 검토의 <b>보조 지표</b>입니다. 면접·현장 동행에서 본 태도와 함께 판단하세요.</div>
    <h2>면접 평가 상세</h2>
    <div class="items">${SECTIONS.filter(x => x.part === 'B').map(sc => { const its = sc.items.filter(isScored); const got = its.reduce((n, it) => n + (rec.confirmed[it.id] || 0), 0), max = its.reduce((n, it) => n + maxOf(it), 0); return `<div class="q"><div class="t">${esc(sc.title)} <span class="muted small" style="font-weight:400">${got}/${max}</span></div><div class="small muted" style="margin-top:4px">${sc.id === 'know' ? (() => { const c = v => its.filter(it => rec.confirmed[it.id] === v).length; return `정확 <b style="color:var(--good)">${c(2)}</b> · 일부 <b style="color:var(--self)">${c(1)}</b> · 모름·틀림 <b style="color:var(--bad)">${c(0)}</b>` + (its.some(it => rec.confirmed[it.id] == null) ? ` · 안 물음 ${its.filter(it => rec.confirmed[it.id] == null).length}` : ''); })() : its.map(it => { const o = it.opts.find(x => x.v === rec.confirmed[it.id]); return esc(it.t.replace(/^[①-⑤]\s*/, '')) + ' <b style="color:' + (rec.confirmed[it.id] === 2 ? 'var(--good)' : rec.confirmed[it.id] === 1 ? 'var(--self)' : 'var(--bad)') + '">' + (o ? esc(o.t) : '-') + '</b>'; }).join(' · ')}</div></div>`; }).join('')}</div>
    <h2>면접관이 고친 문항 (${changed.length})</h2>
    ${changed.length ? `<div class="items">${changed.map(it => { const a = it.opts.find(o => o.v === rec.self[it.id]), b = it.opts.find(o => o.v === rec.confirmed[it.id]); return `<div class="q"><div class="t">${esc(it.t)}</div><div class="small" style="margin-top:4px"><span style="color:var(--self)">지원자 ${esc(a ? a.t : '-')}</span> → <span style="color:var(--accent)">확인 ${esc(b ? b.t : '-')}</span></div></div>`; }).join('')}</div>` : '<p class="small muted">지원자 답과 확인 결과가 모두 같습니다.</p>'}
    ${rec.memo ? `<h2>면접관 메모</h2><div class="card" style="white-space:pre-wrap;font-size:0.9rem">${esc(rec.memo)}</div>` : ''}
    <div class="row" style="margin-top:18px"><button class="btn" id="editBtn">확인 다시 열기</button><button class="btn danger" id="delBtn">이 지원자 기록 삭제</button></div>
    <p class="small muted" style="margin-top:8px">채용이 끝나고 보관할 필요가 없어진 기록은 삭제하세요.</p>`;
  document.getElementById('editBtn').onclick = async () => { rec.status = 'review'; await put(rec); go('#/review/' + rec.id); };
  let armed = 0;
  document.getElementById('delBtn').onclick = async e => {
    if (Date.now() - armed > 4000) { armed = Date.now(); e.target.textContent = '한 번 더 누르면 삭제'; return; }
    await del(rec.id); toast('삭제했습니다'); go('#/');
  };
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash.replace(/^#/, '') || '/';
  const m = h.match(/^\/(\w+)\/(.+)$/);
  if (!m) return viewList();
  if (m[1] === 'self') return viewSelf(decodeURIComponent(m[2]));
  if (m[1] === 'review') return viewReview(decodeURIComponent(m[2]));
  if (m[1] === 'result') return viewResult(decodeURIComponent(m[2]));
  return viewList();
}
window.addEventListener('hashchange', route);
probe().then(route);
</script>
</body>
</html>
