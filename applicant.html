function lsGet() { try { return JSON.parse(localStorage.getItem(LKEY) || '[]'); } catch (e) { return []; } }
function lsSet(list) { try { localStorage.setItem(LKEY, JSON.stringify(list)); } catch (e) {} }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); }

async function listAll() {
  if (sb) {
    const { data, error } = await sb.from(TABLE).select('*').order('created_at', { ascending: false });
    if (!error) { remote = true; return data; }
    console.warn('applicant_checks 표를 읽지 못했습니다 — 이 기기에만 저장합니다.', error);
  }
  remote = false;
  return lsGet().sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
}
async function probe() {
  if (!sb) { remote = false; return; }
  const { error } = await sb.from(TABLE).select('id').limit(1);
  remote = !error;
}
async function getOne(id) {
  if (remote && sb) { const { data } = await sb.from(TABLE).select('*').eq('id', id).maybeSingle(); if (data) return data; }
  return lsGet().find(r => r.id === id) || null;
}
async function put(rec) {
  rec.updated_at = new Date().toISOString();
  if (remote && sb) {
    const { error } = await sb.from(TABLE).upsert(rec);
    if (!error) return true;
    console.error(error); toast('서버 저장 실패 — 이 기기에 저장했습니다');
  }
  const list = lsGet().filter(r => r.id !== rec.id); list.push(rec); lsSet(list);
  return true;
}
async function del(id) {
  if (remote && sb) await sb.from(TABLE).delete().eq('id', id);
  lsSet(lsGet().filter(r => r.id !== id));
}

// ─────────────────────────────────────────────
// 점수
// ─────────────────────────────────────────────
const maxOf = it => Math.max(...it.opts.map(o => o.v));
function scoreOf(answers) {
  const secs = SCORED.map(s => {
    const max = s.items.reduce((n, it) => n + maxOf(it), 0);
    const got = s.items.reduce((n, it) => n + (answers && answers[it.id] != null ? answers[it.id] : 0), 0);
    return { id: s.id, title: s.title, weight: s.weight, pts: max ? got / max * s.weight : 0 };
  });
  return { total: Math.round(secs.reduce((n, s) => n + s.pts, 0)), secs };
}
function answered(answers, sec) { return SECTIONS.filter(s => !sec || s.id === sec).flatMap(s => s.items).filter(it => answers && answers[it.id] != null).length; }
const STATUS = { self: ['지원자 작성 중', 's0'], review: ['면접관 확인 대기', 's1'], done: ['확인 완료', 's2'] };

// ─────────────────────────────────────────────
// 화면
// ─────────────────────────────────────────────
const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200); }
function go(h) { if (location.hash === h) route(); else location.hash = h; }
function setMode(m) { const t = document.getElementById('modeTag'); t.hidden = !m; t.className = 'mode ' + (m === 'self' ? 'self' : 'iv'); t.textContent = m === 'self' ? '지원자 작성' : m === 'iv' ? '면접관' : ''; document.getElementById('backLink').hidden = m === 'self'; }
function fmtD(iso) { if (!iso) return '-'; const d = new Date(iso); return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate(); }

// 목록 (면접관)
async function viewList() {
  setMode('iv');
  $app.innerHTML = `<h1>지원자 체크리스트</h1>
    <p class="lead">면접 날 지원자가 먼저 체크하고, 면접관이 자격증·경력 서류와 확인 질문으로 하나씩 확인합니다. <b style="color:var(--text-bright)">확인된 점수</b>만 연봉 검토의 보조 지표로 씁니다.</p>
    <div class="card"><div class="small muted" style="margin-bottom:8px">새 지원자</div>
      <div class="row"><input class="txt" id="nm" placeholder="이름" maxlength="20" style="flex:2 1 160px"><input class="txt" type="date" id="dt" style="flex:1 1 150px" value="${new Date().toISOString().slice(0, 10)}"><button class="btn self" id="startBtn" style="flex:1 1 150px">지원자 작성 시작</button></div>
      <p class="small muted" style="margin-top:8px">이름과 면접일만 저장합니다. 연락처·나이 같은 개인정보는 넣지 않습니다.</p>
    </div>
    <div id="storeNote" style="margin-top:12px"></div>
    <div class="list" id="list"><div class="muted small">불러오는 중…</div></div>`;
  const start = async () => {
    const name = document.getElementById('nm').value.trim();
    if (!name) { toast('이름을 넣어 주세요'); return; }
    const rec = { id: uid(), name, interview_date: document.getElementById('dt').value || null, status: 'self', self: {}, confirmed: {}, memo: '', created_at: new Date().toISOString() };
    await put(rec); go('#/self/' + rec.id);
  };
  document.getElementById('startBtn').onclick = start;
  document.getElementById('nm').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
  const list = await listAll();
  document.getElementById('storeNote').innerHTML = remote ? '' : `<div class="warn">서버 표(applicant_checks)가 아직 없어 <b>이 기기에만</b> 저장합니다. 표를 만들면 어느 기기에서든 같은 목록을 봅니다.</div>`;
  const box = document.getElementById('list');
  if (!list.length) { box.innerHTML = '<div class="empty">아직 체크한 지원자가 없습니다.</div>'; return; }
  box.innerHTML = list.map(r => {
    const st = STATUS[r.status] || STATUS.self;
    const c = scoreOf(r.confirmed), s = scoreOf(r.self);
    return `<button class="ap" data-id="${esc(r.id)}"><div class="body"><span class="nm">${esc(r.name)}</span><span class="st ${st[1]}">${st[0]}</span><div class="small muted">면접일 ${esc(r.interview_date || '-')}</div></div>
      <div class="sc">${r.status === 'done' ? `<b>${c.total}</b><div class="small muted">확인 점수</div>` : `<b style="color:var(--self)">${s.total}</b><div class="small muted">자가 점수</div>`}</div></button>`;
  }).join('');
  box.querySelectorAll('.ap').forEach(b => b.onclick = () => { const r = list.find(x => x.id === b.dataset.id); go((r.status === 'self' ? '#/self/' : r.status === 'review' ? '#/review/' : '#/result/') + r.id); });
}

// 문항 그리기 (mode: self | review)
function renderItems(rec, mode) {
  const src = mode === 'self' ? rec.self : rec.confirmed;
  return SECTIONS.map(s => `
    <div class="sec-h"><h2>${esc(s.title)}</h2><span class="w">${s.weight ? '비중 ' + s.weight + '점' : '점수 없음'}</span></div>
    <div class="small muted">${esc(s.desc)}</div>
    <div class="items">${s.items.map(it => {
      const cur = src[it.id], was = rec.self[it.id];
      const selfTxt = was != null ? (it.opts.find(o => o.v === was) || {}).t : null;
      const d = mode === 'review' && cur != null && was != null && cur !== was ? `<span class="diff ${cur < was ? 'dn' : 'up'}">${cur < was ? '낮춤' : '올림'}</span>` : '';
      return `<div class="q"><div class="t">${esc(it.t)}${d}</div>${it.d ? `<div class="d">${esc(it.d)}</div>` : ''}
        <div class="opts">${it.opts.map(o => `<button class="opt ${cur === o.v ? 'on' : ''} ${mode === 'review' && was === o.v ? 'was' : ''}" data-it="${it.id}" data-v="${o.v}">${esc(o.t)}</button>`).join('')}</div>
        ${mode === 'review' ? `<div class="said">지원자 답: ${selfTxt ? esc(selfTxt) : '(비워 둠)'}</div>${it.probe ? `<div class="probe"><b>확인:</b> ${esc(it.probe)}${it.ans ? `<div class="ans">기대 답 — ${esc(it.ans)}</div>` : ''}</div>` : ''}` : ''}
      </div>`;
    }).join('')}</div>`).join('');
}

// 지원자 작성
async function viewSelf(id) {
  const rec = await getOne(id); if (!rec) return go('#/');
  if (rec.status !== 'self') return go('#/review/' + id);
  setMode('self');
  document.body.classList.add('self-mode');
  const total = ALL_ITEMS.length;
  const draw = () => {
    $app.innerHTML = `<h1>${esc(rec.name)}님, 해당하는 것을 골라 주세요</h1>
      <p class="lead">있는 그대로 고르시면 됩니다. 면접관이 서류와 질문으로 함께 확인하고, 모르는 건 입사 후 12주 교육에서 배웁니다. 모든 문항은 하는 일과 관련된 것만 묻습니다.</p>
      ${renderItems(rec, 'self')}`;
    $app.querySelectorAll('.opt').forEach(b => b.onclick = () => { rec.self[b.dataset.it] = +b.dataset.v; put(rec); draw(); bar(); });
  };
  const bar = () => {
    let el = document.getElementById('sbar');
    if (!el) { el = document.createElement('div'); el.id = 'sbar'; el.className = 'stickybar'; document.body.appendChild(el); }
    const n = answered(rec.self);
    el.innerHTML = `<div class="in"><div class="prog">${n}/${total} 답함</div><button class="btn self" id="doneBtn" ${n < total ? 'disabled' : ''}>다 골랐어요</button></div>`;
    document.getElementById('doneBtn').onclick = async () => {
      rec.status = 'review'; rec.self_done_at = new Date().toISOString(); await put(rec);
      el.remove(); document.body.classList.remove('self-mode');
      $app.innerHTML = `<div class="card" style="text-align:center;padding:40px 16px"><h1>감사합니다</h1><p class="lead" style="margin:10px 0 18px">기기를 면접관에게 돌려주세요.</p><button class="btn primary" id="toIv">면접관 확인으로 넘어가기</button></div>`;
      document.getElementById('toIv').onclick = () => go('#/review/' + rec.id);
      window.scrollTo(0, 0);
    };
  };
  draw(); bar(); window.scrollTo(0, 0);
}

// 면접관 확인
async function viewReview(id) {
  const rec = await getOne(id); if (!rec) return go('#/');
  setMode('iv');
  document.body.classList.remove('self-mode');
  const sb0 = document.getElementById('sbar'); if (sb0) sb0.remove();
  // 확인값이 비어 있으면 지원자 답으로 시작 — 면접관은 달라진 것만 고칩니다
  let filled = false;
  ALL_ITEMS.forEach(it => { if (rec.confirmed[it.id] == null && rec.self[it.id] != null) { rec.confirmed[it.id] = rec.self[it.id]; filled = true; } });
  if (filled) put(rec);
  const draw = () => {
    const c = scoreOf(rec.confirmed), s = scoreOf(rec.self);
    $app.innerHTML = `<div class="small"><a href="#/" style="text-decoration:none">← 지원자 목록</a></div>
      <h1>${esc(rec.name)} — 면접관 확인</h1>
      <p class="lead">지원자 답(노란 밑줄)에서 시작합니다. 서류와 확인 질문으로 보고 <b style="color:var(--text-bright)">달라진 것만 고치세요.</b> 고친 문항에는 '낮춤/올림'이 붙습니다.</p>
      ${scoreCard(rec)}
      ${renderItems(rec, 'review')}
      <h2>면접관 메모</h2><textarea class="txt" id="memo" placeholder="확인하면서 본 것, 보류한 이유 등">${esc(rec.memo || '')}</textarea>
      <div class="row" style="margin-top:14px"><button class="btn primary" id="finBtn">확인 완료</button><button class="btn ghost" id="backSelf">지원자 작성으로 되돌리기</button></div>`;
    $app.querySelectorAll('.opt').forEach(b => b.onclick = () => { rec.confirmed[b.dataset.it] = +b.dataset.v; put(rec); const y = window.scrollY; draw(); window.scrollTo(0, y); });
    let mt; document.getElementById('memo').addEventListener('input', e => { clearTimeout(mt); mt = setTimeout(() => { rec.memo = e.target.value; put(rec); }, 600); });
    document.getElementById('finBtn').onclick = async () => { rec.memo = document.getElementById('memo').value; rec.status = 'done'; rec.reviewed_at = new Date().toISOString(); await put(rec); toast('확인 완료로 저장했습니다'); go('#/result/' + rec.id); };
    document.getElementById('backSelf').onclick = async () => { rec.status = 'self'; await put(rec); go('#/self/' + rec.id); };
  };
  draw(); window.scrollTo(0, 0);
}

function scoreCard(rec) {
  const c = scoreOf(rec.confirmed), s = scoreOf(rec.self);
  return `<div class="card score" style="margin-top:6px">
    <div><div class="big">${c.total}<small> / 100</small></div><div class="small muted" style="margin-top:6px">확인 점수 · 자가 ${s.total}점${s.total !== c.total ? ` (${c.total - s.total > 0 ? '+' : ''}${c.total - s.total})` : ''}</div></div>
    <div><div class="bars">${c.secs.map((x, i) => `<div class="bar-r"><span>${esc(x.title)}</span><div class="track"><i class="s" style="width:${s.secs[i].pts / x.weight * 100}%"></i><i class="c" style="width:${x.pts / x.weight * 100}%"></i></div><span class="v">${Math.round(x.pts)}/${x.weight}</span></div>`).join('')}</div>
    <div class="legend"><span class="ls">자가</span><span class="lc">확인</span></div></div>
  </div>`;
}

// 결과
async function viewResult(id) {
  const rec = await getOne(id); if (!rec) return go('#/');
  setMode('iv');
  const basic = SECTIONS[0].items.map(it => { const v = rec.confirmed[it.id] != null ? rec.confirmed[it.id] : rec.self[it.id]; const o = it.opts.find(x => x.v === v); return `<span style="margin-right:14px">${esc(it.t)}: <b style="color:${v ? 'var(--good)' : 'var(--bad)'}">${o ? esc(o.t) : '-'}</b></span>`; }).join('');
  const changed = ALL_ITEMS.filter(it => rec.self[it.id] != null && rec.confirmed[it.id] != null && rec.self[it.id] !== rec.confirmed[it.id]);
  $app.innerHTML = `<div class="small"><a href="#/" style="text-decoration:none">← 지원자 목록</a></div>
    <h1>${esc(rec.name)} <span class="st s2" style="vertical-align:middle">확인 완료</span></h1>
    <p class="lead">면접일 ${esc(rec.interview_date || '-')} · 확인 ${fmtD(rec.reviewed_at)}</p>
    ${scoreCard(rec)}
    <div class="card" style="margin-top:10px;font-size:0.88rem">${basic}</div>
    <div class="note" style="margin-top:10px">이 점수는 연봉 검토의 <b>보조 지표</b>입니다. 면접·현장 동행에서 본 태도와 함께 판단하세요.</div>
    <h2>면접관이 고친 문항 (${changed.length})</h2>
    ${changed.length ? `<div class="items">${changed.map(it => { const a = it.opts.find(o => o.v === rec.self[it.id]), b = it.opts.find(o => o.v === rec.confirmed[it.id]); return `<div class="q"><div class="t">${esc(it.t)}</div><div class="small" style="margin-top:4px"><span style="color:var(--self)">지원자 ${esc(a ? a.t : '-')}</span> → <span style="color:var(--accent)">확인 ${esc(b ? b.t : '-')}</span></div></div>`; }).join('')}</div>` : '<p class="small muted">지원자 답과 확인 결과가 모두 같습니다.</p>'}
    ${rec.memo ? `<h2>면접관 메모</h2><div class="card" style="white-space:pre-wrap;font-size:0.9rem">${esc(rec.memo)}</div>` : ''}
    <div class="row" style="margin-top:18px"><button class="btn" id="editBtn">확인 다시 열기</button><button class="btn danger" id="delBtn">이 지원자 기록 삭제</button></div>
    <p class="small muted" style="margin-top:8px">채용이 끝나고 보관할 필요가 없어진 기록은 삭제하세요.</p>`;
  document.getElementById('editBtn').onclick = async () => { rec.status = 'review'; await put(rec); go('#/review/' + rec.id); };
  let armed = 0;
  document.getElementById('delBtn').onclick = async e => {
    if (Date.now() - armed > 4000) { armed = Date.now(); e.target.textContent = '한 번 더 누르면 삭제'; return; }
    await del(rec.id); toast('삭제했습니다'); go('#/');
  };
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash.replace(/^#/, '') || '/';
  const m = h.match(/^\/(\w+)\/(.+)$/);
  if (!m) return viewList();
  if (m[1] === 'self') return viewSelf(decodeURIComponent(m[2]));
  if (m[1] === 'review') return viewReview(decodeURIComponent(m[2]));
  if (m[1] === 'result') return viewResult(decodeURIComponent(m[2]));
  return viewList();
}
window.addEventListener('hashchange', route);
probe().then(route);
</script>
</body>
</html>
