<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 진행률 체크 | 부성티케이 신입사원 교육</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<style>
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --surface2: #1a2332;
    --border: #1e2d3d;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-bright: #f8fafc;
    --p1: #38bdf8;
    --p2: #10b981;
    --p3: #f59e0b;
    --p4: #a78bfa;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    line-height: 1.7;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    background: rgba(17,24,39,0.92);
  }

  .header-inner {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .back-link {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.2s;
  }

  .back-link:hover { color: var(--p1); }

  .header-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-bright);
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .btn-reset {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #ef4444;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-reset:hover {
    background: rgba(239,68,68,0.2);
    border-color: rgba(239,68,68,0.5);
  }

  /* ── MAIN ── */
  .main {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* ── NAME INPUT ── */
  .name-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .name-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .name-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--text-bright);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .name-input:focus { border-color: var(--p1); }
  .name-input::placeholder { color: var(--text-dim); opacity: 0.6; }

  /* ── DASHBOARD ── */
  .dashboard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }

  .dash-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-bright);
  }

  .dash-total {
    font-size: 2rem;
    font-weight: 800;
    color: var(--text-bright);
  }

  .dash-total span {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-dim);
  }

  /* Progress bar */
  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 8px;
    height: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--p1), var(--p2));
    transition: width 0.4s ease;
    min-width: 0;
  }

  .dash-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--surface2);
    border-radius: 10px;
    padding: 14px 16px;
    text-align: center;
  }

  .stat-value {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text-bright);
  }

  .stat-label {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* Phase mini bars */
  .phase-bars {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .phase-bar-item {
    text-align: center;
  }

  .phase-bar-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .phase-bar-track {
    background: var(--surface2);
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
  }

  .phase-bar-track .fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.4s ease;
  }

  .phase-bar-pct {
    font-size: 0.75rem;
    font-weight: 600;
    margin-top: 4px;
    color: var(--text-dim);
  }

  /* ── PHASE SECTIONS ── */
  .phase-section {
    margin-bottom: 16px;
  }

  .phase-toggle {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    transition: all 0.2s;
  }

  .phase-toggle:hover {
    border-color: rgba(255,255,255,0.15);
  }

  .phase-toggle-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .phase-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .phase-toggle-title {
    font-weight: 700;
    color: var(--text-bright);
  }

  .phase-toggle-info {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-left: 8px;
  }

  .phase-toggle-arrow {
    font-size: 0.8rem;
    color: var(--text-dim);
    transition: transform 0.3s;
  }

  .phase-section.open .phase-toggle-arrow {
    transform: rotate(180deg);
  }

  .phase-section.open .phase-toggle {
    border-radius: 12px 12px 0 0;
    border-bottom-color: transparent;
  }

  .phase-body {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    padding: 8px 0;
  }

  .phase-section.open .phase-body {
    display: block;
  }

  /* ── SUBSECTION ── */
  .subsection-title {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 12px 20px 6px;
    border-top: 1px solid var(--border);
  }

  .subsection-title:first-child {
    border-top: none;
  }

  /* ── CHECK ITEM ── */
  .check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    transition: background 0.15s;
  }

  .check-item:hover {
    background: rgba(255,255,255,0.02);
  }

  .check-item-name {
    flex: 1;
    font-size: 0.92rem;
    color: var(--text);
    min-width: 0;
  }

  .check-item.all-done .check-item-name {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: rgba(148,163,184,0.3);
  }

  .check-group {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .check-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 0.75rem;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .check-btn:hover {
    border-color: rgba(255,255,255,0.2);
    color: var(--text);
  }

  .check-btn.checked {
    border-color: rgba(16,185,129,0.5);
    background: rgba(16,185,129,0.1);
    color: #34d399;
  }

  .check-btn .icon { font-size: 0.85rem; }

  /* ── FOOTER ── */
  .page-footer {
    text-align: center;
    padding: 32px 20px 0;
    font-size: 0.82rem;
    color: var(--text-dim);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 520px) {
    .header-inner { flex-wrap: wrap; }
    .dash-stats { grid-template-columns: 1fr 1fr; }
    .phase-bars { grid-template-columns: repeat(2, 1fr); }
    .check-item { flex-wrap: wrap; gap: 6px; }
    .check-group { width: 100%; justify-content: flex-end; }
    .name-section { flex-direction: column; align-items: stretch; }
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 0.85rem;
    color: var(--text-bright);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 200;
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="header-left">
      <a class="back-link" href="index.html">&larr; 메인</a>
      <div class="header-title">학습 진행률 체크</div>
    </div>
    <div class="header-actions">
      <button class="btn-reset" onclick="resetAll()">초기화</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- NAME -->
  <div class="name-section">
    <span class="name-label">수료자 이름</span>
    <input class="name-input" id="nameInput" type="text" placeholder="이름을 입력하세요" maxlength="20">
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard">
    <div class="dash-header">
      <div class="dash-title">전체 진행률</div>
      <div class="dash-total" id="totalPct">0%</div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="totalBar" style="width:0%"></div>
    </div>
    <div class="dash-stats">
      <div class="stat-card">
        <div class="stat-value" id="studyPct">0%</div>
        <div class="stat-label">학습 완료율</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="practicePct">0%</div>
        <div class="stat-label">실습 완료율</div>
      </div>
    </div>
    <div class="phase-bars" id="phaseBars"></div>
  </div>

  <!-- PHASE SECTIONS -->
  <div id="phaseContainer"></div>

  <div class="page-footer">
    부성티케이 현장지원팀 &middot; 12주 교육과정 &middot; 학습 진행률 체크
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── DATA ──
const PHASES = [
  {
    id: 'p1', title: 'Phase 1 · 입문교육', color: '#38bdf8',
    sections: [
      { name: 'Day 1 — 회사와 업무 이해', items: ['회사 소개 (부성티케이 역사·사업 영역)', '팀 소개 (현장지원팀 역할·조직도)', 'A/S 업무 흐름 (접수→배정→출동→완료→정산)'] },
      { name: 'Day 2 — 안전교육', items: ['산업안전보건법 핵심 (법적 의무·과태료)', 'PPE 착용 (안전모·안전화·보호장갑 등)', '위험요소 인식 (감전·추락·화상·가스누출)'] },
      { name: 'Day 3 — 장비 개론', items: ['주요 장비 6종 (냉장고·후드·에어컨·보일러·정수기·제빙기)', 'HACCP 기초 (식품안전관리 기준)', '명판 읽기 (모델명·냉매종류·소비전력·제조일)'] },
      { name: 'Day 4 — HVAC & 전기 기초', items: ['냉동 사이클 (에어컨 원리: 압축→응축→팽창→증발)', '전기 기초 (감전 방지·단상/삼상·접지)'] },
      { name: 'Day 5 — 공구와 측정', items: ['기본 공구 (드라이버·렌치·플라이어·배관공구)', '측정 장비 (클램프 미터·매니폴드·온도계·누설검지기)'] }
    ]
  },
  {
    id: 'p2', title: 'Phase 2 · 기본기술교육', color: '#10b981',
    sections: [
      { name: 'Sec 1 — 냉동설비', items: ['워크인 냉동·냉장고·패널 구조', '냉동기·배관 시스템', '진공 작업·냉매 충전'] },
      { name: 'Sec 2 — 후드 & 환기', items: ['주방 후드 (종류·설치 기준)', '덕트·풍량·급기 계산'] },
      { name: 'Sec 3 — 전기 실무', items: ['전선 종류·색상 구분', '제어 부품 (차단기·접촉기·온도조절기)'] },
      { name: 'Sec 4 — 급배수', items: ['급수 배관·정수기·제빙기 연결', '배수·그리스트랩 관리'] },
      { name: 'Sec 5 — 가스', items: ['LPG vs LNG 차이·안전 규정', '면렌지·가스레인지 연결·점검'] },
      { name: 'Sec 6 — 고장 진단', items: ['진단 순서 5단계 (증상확인→원인분석→부품확인→수리→검증)', '증상별 의심 포인트·공임 단가'] }
    ]
  },
  {
    id: 'p3', title: 'Phase 3 · 현장 OJT', color: '#f59e0b',
    sections: [
      { name: '4주차 — 선배 동행·관찰', items: ['현장 도착 절차·안전 확인', '선배 작업 관찰·기록', '대형 현장 (호텔·급식소) 동행', '고객 응대·커뮤니케이션', '도면 읽기 (평면도·설비 배치도)'] },
      { name: '5~6주차 — 보조 시공', items: ['냉동기 설치 보조', '배관 작업 보조', '전기 결선 보조', '후드·덕트 설치 보조', 'A/S 수리 보조'] },
      { name: '7~8주차 — 독립 실무', items: ['독립 A/S 처리 (단순 고장)', '점검 체크리스트 작성', '작업일지 작성', '견적서 작성', '독립 시공 (소규모 현장)'] }
    ]
  },
  {
    id: 'p4', title: 'Phase 4 · 심화 + 수료', color: '#a78bfa',
    sections: [
      { name: 'Sec 1 — 냉동 심화', items: ['냉동 사이클 심화 (P-h 선도·과열도·과냉도)', '압축기 고장 5가지 (액백·오일부족·밸브파손·모터소손·베어링마모)', '고장 예방·정기점검·관리'] },
      { name: 'Sec 2 — 업무 역량', items: ['프로젝트 관리 (공정표·자재관리·인력배치)', '커뮤니케이션 (보고·협의·민원 대응)', '비용 감각 (자재비·인건비·견적 산출)'] },
      { name: 'Sec 3 — 수료', items: ['종합평가 (필기+실기)', '실전 시나리오 테스트', '수료·성장 경로 안내'] }
    ]
  }
];

const STORAGE_KEY = 'busungtk-training-progress';
const NAME_KEY = 'busungtk-training-name';

// ── STATE ──
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getKey(phaseId, sIdx, iIdx) {
  return `${phaseId}_${sIdx}_${iIdx}`;
}

function toggle(phaseId, sIdx, iIdx, type) {
  const key = getKey(phaseId, sIdx, iIdx);
  if (!state[key]) state[key] = {};
  state[key][type] = !state[key][type];
  saveState();
  updateUI();
}

// ── STATS ──
function calcStats() {
  let totalStudy = 0, totalPractice = 0, totalItems = 0;
  const phaseStats = [];

  PHASES.forEach(phase => {
    let pStudy = 0, pPractice = 0, pTotal = 0;
    phase.sections.forEach((sec, sIdx) => {
      sec.items.forEach((_, iIdx) => {
        const key = getKey(phase.id, sIdx, iIdx);
        const s = state[key] || {};
        if (s.study) { pStudy++; totalStudy++; }
        if (s.practice) { pPractice++; totalPractice++; }
        pTotal++;
        totalItems++;
      });
    });
    phaseStats.push({ id: phase.id, study: pStudy, practice: pPractice, total: pTotal, color: phase.color });
  });

  const totalChecks = totalStudy + totalPractice;
  const maxChecks = totalItems * 2;
  return { totalPct: maxChecks ? Math.round((totalChecks / maxChecks) * 100) : 0, studyPct: totalItems ? Math.round((totalStudy / totalItems) * 100) : 0, practicePct: totalItems ? Math.round((totalPractice / totalItems) * 100) : 0, phaseStats };
}

// ── RENDER ──
function renderPhaseBars(stats) {
  const wrap = document.getElementById('phaseBars');
  wrap.innerHTML = stats.phaseStats.map((p, i) => {
    const pct = p.total ? Math.round(((p.study + p.practice) / (p.total * 2)) * 100) : 0;
    return `<div class="phase-bar-item">
      <div class="phase-bar-label" style="color:${p.color}">P${i+1}</div>
      <div class="phase-bar-track"><div class="fill" style="width:${pct}%;background:${p.color}"></div></div>
      <div class="phase-bar-pct">${pct}%</div>
    </div>`;
  }).join('');
}

function renderPhases() {
  const container = document.getElementById('phaseContainer');
  container.innerHTML = PHASES.map((phase, pIdx) => {
    let itemCount = 0;
    let doneCount = 0;
    phase.sections.forEach((sec, sIdx) => {
      sec.items.forEach((_, iIdx) => {
        itemCount++;
        const key = getKey(phase.id, sIdx, iIdx);
        const s = state[key] || {};
        if (s.study && s.practice) doneCount++;
      });
    });

    const sectionsHTML = phase.sections.map((sec, sIdx) => {
      const itemsHTML = sec.items.map((item, iIdx) => {
        const key = getKey(phase.id, sIdx, iIdx);
        const s = state[key] || {};
        const allDone = s.study && s.practice;
        return `<div class="check-item${allDone ? ' all-done' : ''}">
          <div class="check-item-name">${item}</div>
          <div class="check-group">
            <button class="check-btn${s.study ? ' checked' : ''}" onclick="toggle('${phase.id}',${sIdx},${iIdx},'study')">
              <span class="icon">${s.study ? '\u2705' : '\u{1F4D6}'}</span> 학습
            </button>
            <button class="check-btn${s.practice ? ' checked' : ''}" onclick="toggle('${phase.id}',${sIdx},${iIdx},'practice')">
              <span class="icon">${s.practice ? '\u2705' : '\u{1F527}'}</span> 실습
            </button>
          </div>
        </div>`;
      }).join('');
      return `<div class="subsection-title">${sec.name}</div>${itemsHTML}`;
    }).join('');

    return `<div class="phase-section${pIdx === 0 ? ' open' : ''}" id="phase-${phase.id}">
      <button class="phase-toggle" onclick="togglePhase('${phase.id}')">
        <div class="phase-toggle-left">
          <div class="phase-dot" style="background:${phase.color}"></div>
          <span class="phase-toggle-title">${phase.title}</span>
          <span class="phase-toggle-info" id="info-${phase.id}">${doneCount}/${itemCount} 완료</span>
        </div>
        <span class="phase-toggle-arrow">\u25BC</span>
      </button>
      <div class="phase-body">${sectionsHTML}</div>
    </div>`;
  }).join('');
}

function updateUI() {
  const stats = calcStats();

  // Dashboard
  document.getElementById('totalPct').textContent = stats.totalPct + '%';
  document.getElementById('totalBar').style.width = stats.totalPct + '%';
  document.getElementById('studyPct').textContent = stats.studyPct + '%';
  document.getElementById('practicePct').textContent = stats.practicePct + '%';

  renderPhaseBars(stats);

  // Phase info badges
  PHASES.forEach(phase => {
    let itemCount = 0, doneCount = 0;
    phase.sections.forEach((sec, sIdx) => {
      sec.items.forEach((_, iIdx) => {
        itemCount++;
        const key = getKey(phase.id, sIdx, iIdx);
        const s = state[key] || {};
        if (s.study && s.practice) doneCount++;
      });
    });
    const el = document.getElementById(`info-${phase.id}`);
    if (el) el.textContent = `${doneCount}/${itemCount} 완료`;
  });

  // Re-render check items (state classes)
  PHASES.forEach(phase => {
    phase.sections.forEach((sec, sIdx) => {
      sec.items.forEach((_, iIdx) => {
        const key = getKey(phase.id, sIdx, iIdx);
        const s = state[key] || {};
        // Find matching buttons and update
        const phaseEl = document.getElementById(`phase-${phase.id}`);
        if (!phaseEl) return;
        const items = phaseEl.querySelectorAll('.check-item');
        let flatIdx = 0;
        for (let si = 0; si < phase.sections.length; si++) {
          for (let ii = 0; ii < phase.sections[si].items.length; ii++) {
            if (si === sIdx && ii === iIdx) {
              const item = items[flatIdx];
              if (!item) break;
              const btns = item.querySelectorAll('.check-btn');
              const sk = state[getKey(phase.id, si, ii)] || {};

              btns[0].className = 'check-btn' + (sk.study ? ' checked' : '');
              btns[0].querySelector('.icon').textContent = sk.study ? '\u2705' : '\u{1F4D6}';
              btns[1].className = 'check-btn' + (sk.practice ? ' checked' : '');
              btns[1].querySelector('.icon').textContent = sk.practice ? '\u2705' : '\u{1F527}';

              item.className = 'check-item' + (sk.study && sk.practice ? ' all-done' : '');
            }
            flatIdx++;
          }
        }
      });
    });
  });
}

function togglePhase(id) {
  const el = document.getElementById(`phase-${id}`);
  if (el) el.classList.toggle('open');
}

function resetAll() {
  if (!confirm('모든 진행 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return;
  state = {};
  saveState();
  localStorage.removeItem(NAME_KEY);
  document.getElementById('nameInput').value = '';
  updateUI();
  showToast('초기화 완료');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ── INIT ──
function init() {
  // Name
  const nameInput = document.getElementById('nameInput');
  const savedName = localStorage.getItem(NAME_KEY) || '';
  nameInput.value = savedName;
  nameInput.addEventListener('input', () => {
    localStorage.setItem(NAME_KEY, nameInput.value);
  });

  renderPhases();
  updateUI();
}

init();
</script>

</body>
</html>
