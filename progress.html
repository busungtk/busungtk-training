<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 진행률 체크 | 부성티케이 신입사원 교육</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --surface2: #1a2332;
    --border: #1e2d3d;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-bright: #f8fafc;
    --p1: #38bdf8;
    --p2: #10b981;
    --p3: #f59e0b;
    --p4: #a78bfa;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    line-height: 1.7;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ── HEADER ── */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    background: rgba(17,24,39,0.92);
  }

  .header-inner {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .back-link {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.2s;
    cursor: pointer;
  }

  .back-link:hover { color: var(--p1); }

  .header-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-bright);
  }

  .header-trainee {
    font-size: 0.85rem;
    color: var(--p1);
    font-weight: 600;
    background: rgba(56,189,248,0.1);
    padding: 4px 12px;
    border-radius: 99px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .btn {
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid;
    font-family: inherit;
  }

  .btn-reset {
    background: rgba(239,68,68,0.1);
    border-color: rgba(239,68,68,0.3);
    color: #ef4444;
  }

  .btn-reset:hover {
    background: rgba(239,68,68,0.2);
    border-color: rgba(239,68,68,0.5);
  }

  .btn-primary {
    background: rgba(56,189,248,0.15);
    border-color: rgba(56,189,248,0.4);
    color: var(--p1);
  }

  .btn-primary:hover {
    background: rgba(56,189,248,0.25);
  }

  .btn-danger-text {
    background: none;
    border-color: transparent;
    color: #ef4444;
    font-size: 12px;
    padding: 4px 8px;
    opacity: 0.6;
  }

  .btn-danger-text:hover { opacity: 1; }

  /* ── MAIN ── */
  .main {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* ── SELECT VIEW ── */
  .select-view {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .select-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(56,189,248,0.1);
    border: 1px solid rgba(56,189,248,0.25);
    border-radius: 99px;
    padding: 6px 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--p1);
    letter-spacing: 0.06em;
    margin-bottom: 20px;
  }

  .select-title {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 800;
    color: var(--text-bright);
    margin-bottom: 8px;
  }

  .select-desc {
    font-size: 0.95rem;
    color: var(--text-dim);
    margin-bottom: 32px;
  }

  .trainee-list {
    width: 100%;
    max-width: 480px;
    margin-bottom: 24px;
  }

  .trainee-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }

  .trainee-card:hover {
    border-color: rgba(56,189,248,0.4);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }

  .trainee-info { flex: 1; }

  .trainee-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-bright);
  }

  .trainee-meta {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .trainee-pct {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--p1);
  }

  .new-trainee-form {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    gap: 10px;
  }

  .new-trainee-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text-bright);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .new-trainee-input:focus { border-color: var(--p1); }
  .new-trainee-input::placeholder { color: var(--text-dim); opacity: 0.6; }

  .new-trainee-btn {
    background: var(--p1);
    color: #0a0e17;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .new-trainee-btn:hover { opacity: 0.85; }
  .new-trainee-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .loading-text {
    color: var(--text-dim);
    font-size: 0.9rem;
    padding: 20px;
  }

  .empty-text {
    color: var(--text-dim);
    font-size: 0.88rem;
    padding: 16px;
    margin-bottom: 16px;
  }

  /* ── PROGRESS VIEW ── */
  .progress-view { display: none; }

  /* ── DASHBOARD ── */
  .dashboard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }

  .dash-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-bright);
  }

  .dash-total {
    font-size: 2rem;
    font-weight: 800;
    color: var(--text-bright);
  }

  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 8px;
    height: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--p1), var(--p2));
    transition: width 0.4s ease;
    min-width: 0;
  }

  .dash-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--surface2);
    border-radius: 10px;
    padding: 14px 16px;
    text-align: center;
  }

  .stat-value {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text-bright);
  }

  .stat-label {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .phase-bars {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .phase-bar-item { text-align: center; }

  .phase-bar-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .phase-bar-track {
    background: var(--surface2);
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
  }

  .phase-bar-track .fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.4s ease;
  }

  .phase-bar-pct {
    font-size: 0.75rem;
    font-weight: 600;
    margin-top: 4px;
    color: var(--text-dim);
  }

  /* ── PHASE SECTIONS ── */
  .phase-section { margin-bottom: 16px; }

  .phase-toggle {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    transition: all 0.2s;
  }

  .phase-toggle:hover { border-color: rgba(255,255,255,0.15); }

  .phase-toggle-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .phase-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .phase-toggle-title { font-weight: 700; color: var(--text-bright); }

  .phase-toggle-info {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-left: 8px;
  }

  .phase-toggle-arrow {
    font-size: 0.8rem;
    color: var(--text-dim);
    transition: transform 0.3s;
  }

  .phase-section.open .phase-toggle-arrow { transform: rotate(180deg); }

  .phase-section.open .phase-toggle {
    border-radius: 12px 12px 0 0;
    border-bottom-color: transparent;
  }

  .phase-body {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    padding: 8px 0;
  }

  .phase-section.open .phase-body { display: block; }

  .subsection-title {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 12px 20px 6px;
    border-top: 1px solid var(--border);
  }

  .subsection-title:first-child { border-top: none; }

  .check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    transition: background 0.15s;
  }

  .check-item:hover { background: rgba(255,255,255,0.02); }

  .check-item-name {
    flex: 1;
    font-size: 0.92rem;
    color: var(--text);
    min-width: 0;
  }

  .check-item.all-done .check-item-name {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: rgba(148,163,184,0.3);
  }

  .check-group {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .check-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 0.75rem;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .check-btn:hover {
    border-color: rgba(255,255,255,0.2);
    color: var(--text);
  }

  .check-btn.checked {
    border-color: rgba(16,185,129,0.5);
    background: rgba(16,185,129,0.1);
    color: #34d399;
  }

  .check-btn .icon { font-size: 0.85rem; }

  .page-footer {
    text-align: center;
    padding: 32px 20px 0;
    font-size: 0.82rem;
    color: var(--text-dim);
  }

  .save-indicator {
    font-size: 0.75rem;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .save-indicator.show { opacity: 1; }

  @media (max-width: 520px) {
    .header-inner { flex-wrap: wrap; }
    .dash-stats { grid-template-columns: 1fr 1fr; }
    .phase-bars { grid-template-columns: repeat(2, 1fr); }
    .check-item { flex-wrap: wrap; gap: 6px; }
    .check-group { width: 100%; justify-content: flex-end; }
    .new-trainee-form { flex-direction: column; }
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 0.85rem;
    color: var(--text-bright);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 200;
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="header-left">
      <a class="back-link" id="backBtn" href="index.html">&larr; 메인</a>

</div>

<div class="main">
  <!-- SELECT VIEW -->
  <div class="select-view" id="selectView">

  </div>

  <!-- PROGRESS VIEW -->
  <div class="progress-view" id="progressView">
    <div class="dashboard">

        <div class="dash-title">전체 진행률</div>

        <div class="stat-card">
          <div class="stat-value" id="studyPct">0%</div>
          <div class="stat-label">학습 완료율</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="practicePct">0%</div>
          <div class="stat-label">실습 완료율</div>
        </div>
      </div>
      <div class="phase-bars" id="phaseBars"></div>
    </div>

    <div id="phaseContainer"></div>

    <div class="page-footer">
      부성티케이 현장지원팀 &middot; 12주 교육과정 &middot; 학습 진행률 체크
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

    sections: [
      { name: '4주차 \u2014 선배 동행\xB7관찰', items: ['현장 도착 절차\xB7안전 확인', '선배 작업 관찰\xB7기록', '대형 현장 (호텔\xB7급식소) 동행', '고객 응대\xB7커뮤니케이션', '도면 읽기 (평면도\xB7설비 배치도)'] },
      { name: '5~6주차 \u2014 보조 시공', items: ['냉동기 설치 보조', '배관 작업 보조', '전기 결선 보조', '후드\xB7덕트 설치 보조', 'A/S 수리 보조'] },
      { name: '7~8주차 \u2014 독립 실무', items: ['독립 A/S 처리 (단순 고장)', '점검 체크리스트 작성', '작업일지 작성', '견적서 작성', '독립 시공 (소규모 현장)'] }
    ]
  },
  {
    id: 'p4', title: 'Phase 4 \xB7 심화 + 수료', color: '#a78bfa',
    sections: [
      { name: 'Sec 1 \u2014 냉동 심화', items: ['냉동 사이클 심화 (P-h 선도\xB7과열도\xB7과냉도)', '압축기 고장 5가지 (액백\xB7오일부족\xB7밸브파손\xB7모터소손\xB7베어링마모)', '고장 예방\xB7정기점검\xB7관리'] },
      { name: 'Sec 2 \u2014 업무 역량', items: ['프로젝트 관리 (공정표\xB7자재관리\xB7인력배치)', '커뮤니케이션 (보고\xB7협의\xB7민원 대응)', '비용 감각 (자재비\xB7인건비\xB7견적 산출)'] },
      { name: 'Sec 3 \u2014 수료', items: ['종합평가 (필기+실기)', '실전 시나리오 테스트', '수료\xB7성장 경로 안내'] }
    ]
  }
];

// ── STATE ──
let state = {};
let currentTrainee = null;
let saveTimer = null;

function getKey(phaseId, sIdx, iIdx) {
  return phaseId + '_' + sIdx + '_' + iIdx;
}

// ── SUPABASE OPS ──
async function loadTrainees() {
  const { data, error } = await sb.from('training_progress').select('*').order('updated_at', { ascending: false });
  if (error) { console.error(error); return []; }
  return data || [];
}

async function loadTraineeData(name) {
  const { data } = await sb.from('training_progress').select('*').eq('trainee_name', name).single();
  return data;
}

async function saveToDB() {
  if (!currentTrainee) return;
  const { error } = await sb.from('training_progress')
    .update({ progress: state, updated_at: new Date().toISOString() })
    .eq('trainee_name', currentTrainee);
  if (error) console.error('Save error:', error);
  const ind = document.getElementById('saveIndicator');
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 1500);
}

function debounceSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToDB, 800);
}

async function createTrainee() {
  const input = document.getElementById('newNameInput');
  const name = input.value.trim();
  if (!name) return;

  document.getElementById('newTraineeBtn').disabled = true;
  const { error } = await sb.from('training_progress').insert({ trainee_name: name, progress: {} });

  if (error) {
    if (error.code === '23505') {
      showToast('이미 존재하는 이름입니다');
    } else {
      showToast('등록 실패: ' + error.message);
      console.error(error);
    }
    document.getElementById('newTraineeBtn').disabled = false;
    return;
  }

  input.value = '';
  document.getElementById('newTraineeBtn').disabled = false;
  showToast(name + ' 등록 완료');
  selectTrainee(name);
}

async function deleteTrainee(name, e) {
  e.stopPropagation();
  if (!confirm(name + '의 모든 학습 데이터를 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return;
  await sb.from('training_progress').delete().eq('trainee_name', name);
  showToast(name + ' 삭제됨');
  renderSelectView();
}

// ── VIEWS ──
async function renderSelectView() {
  document.getElementById('selectView').style.display = 'flex';
  document.getElementById('progressView').style.display = 'none';
  document.getElementById('headerActions').style.display = 'none';
  document.getElementById('headerTrainee').style.display = 'none';
  document.getElementById('backBtn').href = 'index.html';
  currentTrainee = null;

  const list = document.getElementById('traineeList');
  list.innerHTML = '<div class="loading-text">불러오는 중...</div>';

  const trainees = await loadTrainees();

  if (trainees.length === 0) {
    list.innerHTML = '<div class="empty-text">등록된 수료자가 없습니다. 아래에서 새로 등록하세요.</div>';
    return;
  }

  list.innerHTML = trainees.map(t => {
    const progress = t.progress || {};
    const stats = calcStatsFrom(progress);
    return '<div class="trainee-card" onclick="selectTrainee(\'' + t.trainee_name.replace(/'/g, "\\'") + '\')">' +
      '<div class="trainee-info">' +
        '<div class="trainee-name">' + t.trainee_name + '</div>' +
        '<div class="trainee-meta">최근 수정: ' + new Date(t.updated_at).toLocaleDateString('ko-KR') + '</div>' +
      '</div>' +
      '<div class="trainee-pct">' + stats.totalPct + '%</div>' +
      '<button class="btn btn-danger-text" onclick="deleteTrainee(\'' + t.trainee_name.replace(/'/g, "\\'") + '\', event)">삭제</button>' +
    '</div>';
  }).join('');
}

async function selectTrainee(name) {
  const data = await loadTraineeData(name);
  if (!data) { showToast('수료자를 찾을 수 없습니다'); return; }

  currentTrainee = name;
  state = data.progress || {};

  document.getElementById('selectView').style.display = 'none';
  document.getElementById('progressView').style.display = 'block';
  document.getElementById('headerActions').style.display = 'flex';
  document.getElementById('headerTrainee').style.display = 'inline';
  document.getElementById('headerTrainee').textContent = name;
  document.getElementById('backBtn').href = '#';
  document.getElementById('backBtn').onclick = function(e) { e.preventDefault(); renderSelectView(); };

  renderPhases();
  updateUI();
}

// ── TOGGLE & STATS ──
function toggle(phaseId, sIdx, iIdx, type) {
  const key = getKey(phaseId, sIdx, iIdx);
  if (!state[key]) state[key] = {};
  state[key][type] = !state[key][type];
  debounceSave();
  updateUI();
}

function calcStatsFrom(progress) {
  let totalStudy = 0, totalPractice = 0, totalItems = 0;
  const phaseStats = [];
  PHASES.forEach(phase => {
    let pStudy = 0, pPractice = 0, pTotal = 0;
    phase.sections.forEach((sec, sIdx) => {
      sec.items.forEach((_, iIdx) => {
        const key = getKey(phase.id, sIdx, iIdx);
        const s = progress[key] || {};
        if (s.study) { pStudy++; totalStudy++; }
        if (s.practice) { pPractice++; totalPractice++; }
        pTotal++; totalItems++;
      });
    });
    phaseStats.push({ id: phase.id, study: pStudy, practice: pPractice, total: pTotal, color: phase.color });
  });
  const totalChecks = totalStudy + totalPractice;
  const maxChecks = totalItems * 2;
  return { totalPct: maxChecks ? Math.round((totalChecks / maxChecks) * 100) : 0, studyPct: totalItems ? Math.round((totalStudy / totalItems) * 100) : 0, practicePct: totalItems ? Math.round((totalPractice / totalItems) * 100) : 0, phaseStats };
}

function calcStats() {
  return calcStatsFrom(state);
}

// ── RENDER ──
function renderPhaseBars(stats) {
  document.getElementById('phaseBars').innerHTML = stats.phaseStats.map((p, i) => {
    const pct = p.total ? Math.round(((p.study + p.practice) / (p.total * 2)) * 100) : 0;
    return '<div class="phase-bar-item"><div class="phase-bar-label" style="color:' + p.color + '">P' + (i+1) + '</div><div class="phase-bar-track"><div class="fill" style="width:' + pct + '%;background:' + p.color + '"></div></div><div class="phase-bar-pct">' + pct + '%</div></div>';
  }).join('');
}

function renderPhases() {
  const container = document.getElementById('phaseContainer');
  container.innerHTML = PHASES.map((phase, pIdx) => {
    let itemCount = 0, doneCount = 0;
    phase.sections.forEach((sec, sIdx) => {
      sec.items.forEach((_, iIdx) => {
        itemCount++;
        const s = state[getKey(phase.id, sIdx, iIdx)] || {};
        if (s.study && s.practice) doneCount++;
      });
    });
    const sectionsHTML = phase.sections.map((sec, sIdx) => {
      const itemsHTML = sec.items.map((item, iIdx) => {
        const s = state[getKey(phase.id, sIdx, iIdx)] || {};
        const allDone = s.study && s.practice;
        return '<div class="check-item' + (allDone ? ' all-done' : '') + '">' +
          '<div class="check-item-name">' + item + '</div>' +
          '<div class="check-group">' +
            '<button class="check-btn' + (s.study ? ' checked' : '') + '" onclick="toggle(\'' + phase.id + '\',' + sIdx + ',' + iIdx + ',\'study\')">' +
              '<span class="icon">' + (s.study ? '\u2705' : '\u{1F4D6}') + '</span> 학습</button>' +
            '<button class="check-btn' + (s.practice ? ' checked' : '') + '" onclick="toggle(\'' + phase.id + '\',' + sIdx + ',' + iIdx + ',\'practice\')">' +
              '<span class="icon">' + (s.practice ? '\u2705' : '\u{1F527}') + '</span> 실습</button>' +
          '</div></div>';
      }).join('');
      return '<div class="subsection-title">' + sec.name + '</div>' + itemsHTML;
    }).join('');

    return '<div class="phase-section' + (pIdx === 0 ? ' open' : '') + '" id="phase-' + phase.id + '">' +
      '<button class="phase-toggle" onclick="togglePhase(\'' + phase.id + '\')">' +
        '<div class="phase-toggle-left">' +
          '<div class="phase-dot" style="background:' + phase.color + '"></div>' +
          '<span class="phase-toggle-title">' + phase.title + '</span>' +
          '<span class="phase-toggle-info" id="info-' + phase.id + '">' + doneCount + '/' + itemCount + ' 완료</span>' +
        '</div>' +
        '<span class="phase-toggle-arrow">\u25BC</span>' +
      '</button>' +
      '<div class="phase-body">' + sectionsHTML + '</div></div>';
  }).join('');
}

function updateUI() {
  const stats = calcStats();
  document.getElementById('totalPct').textContent = stats.totalPct + '%';
  document.getElementById('totalBar').style.width = stats.totalPct + '%';
  document.getElementById('studyPct').textContent = stats.studyPct + '%';
  document.getElementById('practicePct').textContent = stats.practicePct + '%';
  renderPhaseBars(stats);

  PHASES.forEach(phase => {
    let itemCount = 0, doneCount = 0;
    phase.sections.forEach((sec, sIdx) => {
      sec.items.forEach((_, iIdx) => {
        itemCount++;
        const s = state[getKey(phase.id, sIdx, iIdx)] || {};
        if (s.study && s.practice) doneCount++;
      });
    });
    const el = document.getElementById('info-' + phase.id);
    if (el) el.textContent = doneCount + '/' + itemCount + ' 완료';
  });

  // Update check buttons
  PHASES.forEach(phase => {
    const phaseEl = document.getElementById('phase-' + phase.id);
    if (!phaseEl) return;
    const items = phaseEl.querySelectorAll('.check-item');
    let flatIdx = 0;
    phase.sections.forEach((sec, sIdx) => {
      sec.items.forEach((_, iIdx) => {
        const item = items[flatIdx];
        if (!item) { flatIdx++; return; }
        const sk = state[getKey(phase.id, sIdx, iIdx)] || {};
        const btns = item.querySelectorAll('.check-btn');
        btns[0].className = 'check-btn' + (sk.study ? ' checked' : '');
        btns[0].querySelector('.icon').textContent = sk.study ? '\u2705' : '\u{1F4D6}';
        btns[1].className = 'check-btn' + (sk.practice ? ' checked' : '');
        btns[1].querySelector('.icon').textContent = sk.practice ? '\u2705' : '\u{1F527}';
        item.className = 'check-item' + (sk.study && sk.practice ? ' all-done' : '');
        flatIdx++;
      });
    });
  });
}

function togglePhase(id) {
  const el = document.getElementById('phase-' + id);
  if (el) el.classList.toggle('open');
}

async function resetProgress() {
  if (!currentTrainee) return;
  if (!confirm(currentTrainee + '의 모든 진행 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return;
  state = {};
  await sb.from('training_progress')
    .update({ progress: {}, updated_at: new Date().toISOString() })
    .eq('trainee_name', currentTrainee);
  renderPhases();
  updateUI();
  showToast('초기화 완료');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// Enter key for new trainee
document.getElementById('newNameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') createTrainee();
});

// ── INIT ──
renderSelectView();
</script>
